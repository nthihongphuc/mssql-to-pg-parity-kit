name: CI — Parity Engine & Audit Trail

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify:
    name: Pytest & Offline Parity CLI Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: python -m pytest -v

      - name: Validate offline snapshot fixture
        run: python -m src.cli validate --snapshot-dir fixtures/retail_demo_run

      - name: Run 5-layer offline parity comparison
        run: >-
          python -m src.cli compare
          --snapshot-dir fixtures/retail_demo_run
          --out /tmp/parity_report.md
          --sql-out /tmp/audit.sql
