# Live Heterogeneous Demo Stack: SQL Server 2022 (sql-src-01) -> PostgreSQL 16 (pg-target-01)
#
# Usage:
#   1. Copy ../.env.example to ../.env and set non-placeholder passwords.
#   2. docker compose --env-file ../.env -f demo/docker-compose.yml up -d
#   3. Initialize SQL Server:
#        docker exec -i sql-src-01 /opt/mssql-tools18/bin/sqlcmd \
#          -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -i /init/mssql_init.sql
#   4. PostgreSQL automatically executes /docker-entrypoint-initdb.d/*.sql on first boot.

services:
  sql-src-01:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-src-01
    hostname: sql-src-01
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./mssql_init.sql:/init/mssql_init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - parity_net

  pg-target-01:
    image: postgres:16-alpine
    container_name: pg-target-01
    hostname: pg-target-01
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-retail_demo}"
      POSTGRES_USER: "${POSTGRES_USER:-retail_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_init.sql:/docker-entrypoint-initdb.d/01_pg_init.sql:ro
      - ../sql/migration_audit_schema.sql:/docker-entrypoint-initdb.d/02_migration_audit_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - parity_net

volumes:
  mssql_data:
  pg_data:

networks:
  parity_net:
    driver: bridge
